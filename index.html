<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pee Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  #map { width: 100%; height: 60vh; }
  #controls {
    height: 40vh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
    gap: 8px;
    background: #f5f5f5;
    overflow-y: auto;
  }
  button {
    font-size: 18px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  #startBtn { background: #2e7d32; color: white; }
  #stopBtn { background: #c62828; color: white; }
  #peeBtn { background: #f9a825; color: black; font-size: 22px; }
  #heatBtn { background: #1565c0; color: white; }
  #exportBtn, #clearBtn, #cacheBtn { background: #555; color: white; font-size: 14px; padding: 10px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  #status { font-size: 13px; color: #333; text-align: center; min-height: 18px; }
  #stats { font-size: 12px; color: #555; text-align: center; }
  #cacheProgress { font-size: 12px; color: #1565c0; text-align: center; min-height: 16px; }
  progress { width: 100%; height: 10px; }
</style>
</head>
<body>

<div id="map"></div>
<div id="controls">
  <div id="status">Ready</div>
  <div class="row">
    <button id="startBtn">▶ Start Walk</button>
    <button id="stopBtn">⏹ Stop Walk</button>
  </div>
  <button id="peeBtn">💦 PEE!</button>
  <div class="row">
    <button id="heatBtn">🔥 Toggle Heatmap</button>
  </div>
  <div class="row">
    <button id="exportBtn">⬇ Export Data</button>
    <button id="clearBtn">🗑 Clear All</button>
  </div>
  <button id="cacheBtn">📥 Cache 5-Mile Map Area (do on WiFi)</button>
  <progress id="cacheBar" value="0" max="100" style="display:none;"></progress>
  <div id="cacheProgress"></div>
  <div id="stats">0 walks, 0 pee events logged</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>

/* ================= STORAGE ================= */
const STORE_KEY = 'peeTrackerData';
function loadData() {
  const raw = localStorage.getItem(STORE_KEY);
  return raw ? JSON.parse(raw) : { walks: [], pees: [] };
}
function saveData(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
let data = loadData();

/* ================= MAP SETUP ================= */
const map = L.map('map', { tap: true }).setView([40.7128, -74.0060], 13);

const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_SUBDOMAINS = ['a', 'b', 'c'];

L.tileLayer(TILE_URL, {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

let currentPosMarker = null;
let walkPolyline = null;
let currentWalkCoords = [];
let watchId = null;
let isWalking = false;
let heatLayer = null;
let heatVisible = false;
let peeMarkersLayer = L.layerGroup().addTo(map);
let walkPathsLayer = L.layerGroup().addTo(map);

function statusMsg(msg) { document.getElementById('status').textContent = msg; }
function updateStats() {
  document.getElementById('stats').textContent =
    `${data.walks.length} walks, ${data.pees.length} pee events logged`;
}

function renderExistingData() {
  walkPathsLayer.clearLayers();
  peeMarkersLayer.clearLayers();
  data.walks.forEach(w => {
    if (w.path && w.path.length > 1) {
      L.polyline(w.path.map(p => [p.lat, p.lng]), { color: 'blue', weight: 3, opacity: 0.5 }).addTo(walkPathsLayer);
    }
  });
  data.pees.forEach(p => {
    L.circleMarker([p.lat, p.lng], { radius: 6, color: 'orange', fillColor: '#f9a825', fillOpacity: 0.9 })
      .bindPopup(`Pee at ${new Date(p.timestamp).toLocaleString()}`)
      .addTo(peeMarkersLayer);
  });
  updateStats();
}
renderExistingData();

function placeCurrentMarker(lat, lng) {
  if (currentPosMarker) {
    currentPosMarker.setLatLng([lat, lng]);
  } else {
    currentPosMarker = L.circleMarker([lat, lng], { radius: 8, color: 'blue', fillColor: '#2196f3', fillOpacity: 1 }).addTo(map);
  }
}

let lastKnownLat = null;
let lastKnownLng = null;

function centerOnMe() {
  if (!navigator.geolocation) { statusMsg('Geolocation not supported on this browser'); return; }
  statusMsg('Finding your location...');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    lastKnownLat = latitude;
    lastKnownLng = longitude;
    map.setView([latitude, longitude], 17);
    placeCurrentMarker(latitude, longitude);
    statusMsg('Location found');
  }, err => {
    statusMsg('Location error: ' + err.message + ' (check location permission)');
  }, { enableHighAccuracy: true, timeout: 15000 });
}
centerOnMe();

/* ================= WALK TRACKING ================= */
document.getElementById('startBtn').addEventListener('click', () => {
  if (isWalking) { statusMsg('Already walking'); return; }
  isWalking = true;
  currentWalkCoords = [];
  statusMsg('Walking... tracking location');
  if (walkPolyline) map.removeLayer(walkPolyline);
  walkPolyline = L.polyline([], { color: 'green', weight: 4 }).addTo(map);

  watchId = navigator.geolocation.watchPosition(pos => {
    const { latitude, longitude, accuracy } = pos.coords;
    const point = { lat: latitude, lng: longitude, timestamp: Date.now(), accuracy };
    currentWalkCoords.push(point);
    walkPolyline.addLatLng([latitude, longitude]);
    placeCurrentMarker(latitude, longitude);
    map.panTo([latitude, longitude]);
    statusMsg(`Walking... ${currentWalkCoords.length} points (±${Math.round(accuracy)}m)`);
  }, err => {
    statusMsg('Location error: ' + err.message);
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
});

document.getElementById('stopBtn').addEventListener('click', () => {
  if (!isWalking) { statusMsg('Not currently walking'); return; }
  isWalking = false;
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  if (currentWalkCoords.length > 0) {
    data.walks.push({
      id: Date.now(),
      startTime: currentWalkCoords[0].timestamp,
      endTime: currentWalkCoords[currentWalkCoords.length - 1].timestamp,
      path: currentWalkCoords
    });
    saveData(data);
    updateStats();
  }
  statusMsg('Walk stopped and saved.');
});

/* ================= PEE BUTTON ================= */
document.getElementById('peeBtn').addEventListener('click', () => {
  statusMsg('Getting location for pee...');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude, accuracy } = pos.coords;
    const peeEvent = { lat: latitude, lng: longitude, timestamp: Date.now(), accuracy };
    data.pees.push(peeEvent);
    saveData(data);
    L.circleMarker([latitude, longitude], { radius: 8, color: 'orange', fillColor: '#f9a825', fillOpacity: 1 })
      .bindPopup(`Pee at ${new Date(peeEvent.timestamp).toLocaleString()}`)
      .addTo(peeMarkersLayer).openPopup();
    statusMsg(`Pee logged! (±${Math.round(accuracy)}m accuracy)`);
    updateStats();
    if (heatVisible) refreshHeatmap();
  }, err => {
    statusMsg('Could not get location for pee: ' + err.message);
  }, { enableHighAccuracy: true, timeout: 10000 });
});

/* ================= HEATMAP ================= */
function refreshHeatmap() {
  if (heatLayer) map.removeLayer(heatLayer);
  const points = data.pees.map(p => [p.lat, p.lng, 0.6]);
  heatLayer = L.heatLayer(points, { radius: 30, blur: 25, maxZoom: 18 });
  if (heatVisible) heatLayer.addTo(map);
}

document.getElementById('heatBtn').addEventListener('click', () => {
  heatVisible = !heatVisible;
  if (heatVisible) {
    refreshHeatmap();
    peeMarkersLayer.remove();
    walkPathsLayer.remove();
    statusMsg('Heatmap view ON');
  } else {
    if (heatLayer) map.removeLayer(heatLayer);
    peeMarkersLayer.addTo(map);
    walkPathsLayer.addTo(map);
    statusMsg('Heatmap view OFF');
  }
});

/* ================= EXPORT / CLEAR ================= */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pee-tracker-export-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  statusMsg('Data exported');
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Delete ALL walks and pee data? This cannot be undone.')) {
    data = { walks: [], pees: [] };
    saveData(data);
    renderExistingData();
    if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
    statusMsg('All data cleared.');
  }
});

/* ================= TILE CACHING (5-mile offline area) ================= */
const CACHE_NAME = 'pee-tracker-tiles-v1';
const MILES_TO_METERS = 1609.34;
const CACHE_RADIUS_MILES = 5;
const CACHE_ZOOM_LEVELS = [14, 15, 16, 17];

function lonLatToTile(lat, lon, zoom) {
  const n = Math.pow(2, zoom);
  const x = Math.floor((lon + 180) / 360 * n);
  const latRad = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
  return { x, y };
}

function metersToDegreesLat(meters) {
  return meters / 111320;
}
function metersToDegreesLon(meters, atLat) {
  return meters / (111320 * Math.cos(atLat * Math.PI / 180));
}

function buildTileList(centerLat, centerLon, radiusMiles, zoomLevels) {
  const radiusMeters = radiusMiles * MILES_TO_METERS;
  const dLat = metersToDegreesLat(radiusMeters);
  const dLon = metersToDegreesLon(radiusMeters, centerLat);

  const minLat = centerLat - dLat;
  const maxLat = centerLat + dLat;
  const minLon = centerLon - dLon;
  const maxLon = centerLon + dLon;

  const tiles = [];
  zoomLevels.forEach(z => {
    const topLeft = lonLatToTile(maxLat, minLon, z);
    const bottomRight = lonLatToTile(minLat, maxLon, z);

    const minX = Math.min(topLeft.x, bottomRight.x);
    const maxX = Math.max(topLeft.x, bottomRight.x);
    const minY = Math.min(topLeft.y, bottomRight.y);
    const maxY = Math.max(topLeft.y, bottomRight.y);

    for (let x = minX; x <= maxX; x++) {
      for (let y = minY; y <= maxY; y++) {
        tiles.push({ z, x, y });
      }
    }
  });
  return tiles;
}

async function cacheTiles(centerLat, centerLon) {
  const tiles = buildTileList(centerLat, centerLon, CACHE_RADIUS_MILES, CACHE_ZOOM_LEVELS);
  const total = tiles.length;

  if (total > 6000) {
    const proceed = confirm(`This will download ${total} map tiles, which may take a while and use noticeable data. Continue?`);
    if (!proceed) { statusMsg('Caching cancelled.'); return; }
  }

  const cache = await caches.open(CACHE_NAME);
  const bar = document.getElementById('cacheBar');
  bar.style.display = 'block';
  bar.max = total;
  bar.value = 0;

  let done = 0;
  let failed = 0;

  for (const t of tiles) {
    const sub = TILE_SUBDOMAINS[(t.x + t.y) % TILE_SUBDOMAINS.length];
    const url = `https://${sub}.tile.openstreetmap.org/${t.z}/${t.x}/${t.y}.png`;
    try {
      const existing = await cache.match(url);
      if (!existing) {
        const response = await fetch(url, { mode: 'cors' });
        if (response.ok) {
          await cache.put(url, response);
        } else {
          failed++;
        }
      }
    } catch (e) {
      failed++;
    }
    done++;
    bar.value = done;
    document.getElementById('cacheProgress').textContent =
      `Caching tiles: ${done}/${total}${failed ? ' (' + failed + ' failed)' : ''}`;
    // Small delay to avoid hammering the tile server
    if (done % 20 === 0) await new Promise(r => setTimeout(r, 50));
  }

  document.getElementById('cacheProgress').textContent =
    `Done! ${done - failed}/${total} tiles cached for offline use.`;
  statusMsg('Map area cached for offline use.');
}

document.getElementById('cacheBtn').addEventListener('click', () => {
  if (!('caches' in window)) {
    statusMsg('Offline caching not supported in this browser.');
    return;
  }
  statusMsg('Getting your location to begin caching...');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    statusMsg('Starting tile download...');
    cacheTiles(latitude, longitude);
  }, err => {
    statusMsg('Could not get location: ' + err.message);
  }, { enableHighAccuracy: true, timeout: 15000 });
});

/* ================= SERVICE WORKER FOR OFFLINE TILE SERVING ================= */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE_NAME = '${CACHE_NAME}';
    self.addEventListener('fetch', event => {
      const url = event.request.url;
      if (url.includes('tile.openstreetmap.org')) {
        event.respondWith(
          caches.open(CACHE_NAME).then(cache => {
            return cache.match(event.request).then(cached => {
              if (cached) return cached;
              return fetch(event.request).then(response => {
                if (response.ok) cache.put(event.request, response.clone());
                return response;
              }).catch(() => cached);
            });
          })
        );
      }
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(e => {
    console.log('Service worker registration failed:', e);
  });
}

</script>
</body>
</html>
